name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 for dependency vendoring
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Bundle Web, Server, and Vendor Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/server/vendor
          cp -r pwa/* android/app/src/main/assets/web/
          cp -r server/* android/app/src/main/assets/server/
          rm -rf android/app/src/main/assets/server/__pycache__
          
          # Pre-vendor pure python dependencies for standalone execution
          pip install --target android/app/src/main/assets/server/vendor fastapi uvicorn httpx pydantic starlette anyio

      - name: Setup Deterministic Signing Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk
