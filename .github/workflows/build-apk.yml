name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Bundle Web and Server Assets into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/server
          cp -r pwa/* android/app/src/main/assets/web/
          cp -r server/* android/app/src/main/assets/server/
          rm -rf android/app/src/main/assets/server/__pycache__

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk
