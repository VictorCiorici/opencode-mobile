name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"
      - "daemon/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compile Native Static ARM64 Daemon
        run: |
          # Directories are no longer kept in git (binaries are untracked).
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/bin
          cd daemon
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so .
          cp ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so ../android/app/src/main/assets/bin/openforge-daemon
          cd ..
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libdaemon.so android/app/src/main/assets/bin/openforge-daemon

      - name: Bundle opencode engine (arm64 musl, self-sufficient subscriptions)
        run: |
          mkdir -p /tmp/oc /tmp/ziproot/bin
          curl -fsSL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-arm64-musl.tar.gz -o /tmp/oc.tar.gz
          tar -xzf /tmp/oc.tar.gz -C /tmp/oc
          BIN=$(find /tmp/oc -type f -name opencode | head -1)
          test -n "$BIN" || { echo "opencode binary not found in archive"; exit 1; }
          cp "$BIN" /tmp/ziproot/bin/opencode
          chmod 755 /tmp/ziproot/bin/opencode
          zip -qr android/app/src/main/assets/runtime-arm64.zip bin
          ls -lh android/app/src/main/assets/runtime-arm64.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Copy Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r pwa/* android/app/src/main/assets/web/

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r server/requirements.txt pytest

      - name: Run bridge tests
        working-directory: server
        run: python -m pytest tests/ -v
