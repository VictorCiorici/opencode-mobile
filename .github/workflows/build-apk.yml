name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"
      - "daemon/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compile Native Static ARM64 Daemon
        run: |
          # Directories are no longer kept in git (binaries are untracked).
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/bin
          cd daemon
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so .
          cp ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so ../android/app/src/main/assets/bin/openforge-daemon
          cd ..
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libdaemon.so android/app/src/main/assets/bin/openforge-daemon

      - name: Bundle opencode engine + musl runtime (assets)
        run: |
          mkdir -p /tmp/oc /tmp/rt/bin
          # musl build: musl never calls set_robust_list(99)/rseq(293)/
          # clone3(435), which Android's app seccomp policy SIGSYS-kills
          # (RET_KILL outranks any stacked ERRNO shim, so glibc builds
          # cannot run in-process at all).
          curl -fsSL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-arm64-musl.tar.gz -o /tmp/oc.tar.gz
          tar -xzf /tmp/oc.tar.gz -C /tmp/oc
          BIN=$(find /tmp/oc -type f -name opencode | head -1)
          test -n "$BIN" || { echo "opencode binary not found in archive"; exit 1; }
          cp "$BIN" /tmp/rt/bin/opencode
          # musl loader + C++ runtime from Alpine (all land in bin/ next to
          # the engine; the daemon invokes ld-musl with --library-path bin).
          ALPINE=https://dl-cdn.alpinelinux.org/alpine/v3.19/main/aarch64
          fetch() { # fetch <apk-name> <soname...>
            local apk="$1"; shift
            curl -fsSL "$ALPINE/$apk" -o /tmp/pkg.apk
            rm -rf /tmp/pkgx && mkdir -p /tmp/pkgx && tar -xzf /tmp/pkg.apk -C /tmp/pkgx
            for f in "$@"; do
              # Alpine ships versioned .so files (e.g. libstdc++.so.6.0.32)
              # plus a SONAME symlink; find the real file and copy it under
              # the SONAME (libstdc++.so.6) the musl loader actually resolves.
              src=$(find /tmp/pkgx -type f -name "${f}*" | head -1)
              if [ -n "$src" ]; then
                cp "$src" "/tmp/rt/bin/$f"
              else
                echo "WARN: $f not found in $apk"
              fi
            done
          }
          fetch musl-1.2.4_git20230717-r6.apk ld-musl-aarch64.so.1
          fetch 'libstdc++-13.2.1_git20231014-r0.apk' libstdc++.so.6
          fetch libgcc-13.2.1_git20231014-r0.apk libgcc_s.so.1

          # git (Alpine, musl-linked) so the app has a working VCS without a
          # system git. It runs through the same musl loader as the engine.
          # Resolve exact apk filenames from the Alpine index (v3.19 is stable,
          # but this avoids hardcoding versions).
          ALPIDX=$(curl -fsSL "$ALPINE/APKINDEX.tar.gz" | tar -xzf - -O APKINDEX)
          apkurl() {  # apkurl <pkg> -> URL for <pkg>-<ver>.apk
            local p="$1"
            local v=$(printf '%s' "$ALPIDX" | grep -A12 "^P:$p\$" | grep -m1 '^V:' | sed 's/^V://')
            echo "$ALPINE/$p-$v.apk"
          }
          apkso() {  # apkso <pkg...>: copy every .so* from each apk into bin/,
            # creating the SONAME symlink (apks don't ship it; it's made at
            # ldconfig time) so the musl loader can resolve the library. Apks
            # that DO ship the SONAME as a symlink are copied as-is.
            for p in "$@"; do
              curl -fsSL "$(apkurl "$p")" -o /tmp/pkg.apk
              rm -rf /tmp/pkgx && mkdir -p /tmp/pkgx && tar -xzf /tmp/pkg.apk -C /tmp/pkgx
              find /tmp/pkgx -name '*.so*' | while read -r f; do
                b=$(basename "$f")
                if [ -L "$f" ]; then
                  # apks ship SONAME symlinks (e.g. /lib/libssl.so.3 ->
                  # ../../lib/libssl.so.3) whose targets are only valid in the
                  # full /usr/lib tree; copy the resolved real file instead.
                  real=$(readlink -f "$f")
                  if [ -f "$real" ]; then cp "$real" "/tmp/rt/bin/$b"; fi
                else
                  cp "$f" "/tmp/rt/bin/$b"
                  son=$(readelf -d "$f" 2>/dev/null | awk -F'[][]' '/SONAME/ {print $2}')
                  if [ -n "$son" ] && [ ! -e "/tmp/rt/bin/$son" ]; then
                    ln -sf "$b" "/tmp/rt/bin/$son"
                  fi
                fi
              done
            done
          }
          # git main binary (only needs pcre2 + zlib beyond the musl loader)
          curl -fsSL "$(apkurl git)" -o /tmp/git.apk
          rm -rf /tmp/gitx && mkdir -p /tmp/gitx && tar -xzf /tmp/git.apk -C /tmp/gitx
          cp /tmp/gitx/usr/bin/git /tmp/rt/bin/git
          chmod +x /tmp/rt/bin/git
          # git-core helpers (git-remote-http, upload-pack, ...) — needed for
          # https remotes and local clone/fetch/pull. They are musl binaries,
          # so we keep the real ones under git-core-real/ and expose musl-loader
          # wrapper scripts under git-core/ (GIT_EXEC_PATH points here). The
          # wrappers let git exec them under the loader on Android.
          mkdir -p /tmp/rt/bin/git-core-real /tmp/rt/bin/git-core
          cp -r /tmp/gitx/usr/libexec/git-core/* /tmp/rt/bin/git-core-real/ 2>/dev/null || true
          chmod +x /tmp/rt/bin/git-core-real/* 2>/dev/null || true
          for h in /tmp/rt/bin/git-core-real/*; do
            n=$(basename "$h")
            # Use printf (not a heredoc) so the script has no leading whitespace
            # before its shebang, which a YAML-indented heredoc would otherwise add.
            printf '#!/system/bin/sh\nBIN=$(cd "$(dirname "$0")/.." && pwd)\nexec "$BIN/ld-musl-aarch64.so.1" --library-path "$BIN" "$BIN/git-core-real/%s" "$@"\n' "$n" > "/tmp/rt/bin/git-core/$n"
            chmod +x "/tmp/rt/bin/git-core/$n"
          done
          # git's shared libs: main (pcre2, zlib) plus git-core helper deps.
          # alpine splits runtime libs into *-libs/*3 packages, so we name
          # those explicitly (libexpat, nghttp2-libs, brotli-libs, lz4-libs,
          # libssl3, libcrypto3, libcurl, libintl) plus their transitive deps.
          apkso zlib pcre2 libexpat nghttp2-libs brotli-libs lz4-libs libssh2 libpsl c-ares libssl3 libcrypto3 libcurl libintl libidn2 libunistring gettext
          # zstd is used by some git operations
          apkso zstd-libs
          # CA bundle for https remotes
          curl -fsSL "$(apkurl ca-certificates)" -o /tmp/ca.apk
          rm -rf /tmp/cax && mkdir -p /tmp/cax && tar -xzf /tmp/ca.apk -C /tmp/cax
          cp /tmp/cax/etc/ssl/certs/ca-certificates.crt /tmp/rt/bin/ca-certificates.crt 2>/dev/null || true

          (cd /tmp/rt && zip -qr "$GITHUB_WORKSPACE/android/app/src/main/assets/runtime-arm64.zip" .)
          unzip -l android/app/src/main/assets/runtime-arm64.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Copy Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r pwa/* android/app/src/main/assets/web/

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r server/requirements.txt pytest

      - name: Run bridge tests
        working-directory: server
        run: python -m pytest tests/ -v
