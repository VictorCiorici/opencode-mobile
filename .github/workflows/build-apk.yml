name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"
      - "daemon/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compile Native Static ARM64 Daemon
        run: |
          # Directories are no longer kept in git (binaries are untracked).
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/bin
          cd daemon
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so .
          cp ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so ../android/app/src/main/assets/bin/openforge-daemon
          cd ..
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libdaemon.so android/app/src/main/assets/bin/openforge-daemon

      - name: Bundle opencode engine + glibc runtime (assets)
        run: |
          mkdir -p /tmp/oc /tmp/rt/bin /tmp/rt/lib
          curl -fsSL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-arm64.tar.gz -o /tmp/oc.tar.gz
          tar -xzf /tmp/oc.tar.gz -C /tmp/oc
          BIN=$(find /tmp/oc -type f -name opencode | head -1)
          test -n "$BIN" || { echo "opencode binary not found in archive"; exit 1; }
          cp "$BIN" /tmp/rt/bin/opencode
          # glibc loader + shared libs. Pinned to Debian 12 (glibc 2.36): newer
          # glibc (2.40+) uses syscalls that Android's app seccomp filter kills
          # with SIGSYS, while 2.36 is proven to run under it (Termux proot).
          DEB=$(curl -fsSL "http://deb.debian.org/debian/pool/main/g/glibc/" | grep -oE 'libc6_2\.36-9\+deb12u[0-9]+_arm64\.deb' | sort -uV | tail -1)
          test -n "$DEB" || { echo "no libc6 deb found"; exit 1; }
          curl -fsSL "http://deb.debian.org/debian/pool/main/g/glibc/$DEB" -o /tmp/libc6.deb
          mkdir -p /tmp/deb && (cd /tmp/deb && ar x /tmp/libc6.deb)
          tar -xf /tmp/deb/data.tar.* -C /tmp/deb
          GL=/tmp/deb/lib/aarch64-linux-gnu; [ -f "$GL/libc.so.6" ] || GL=/tmp/deb/usr/lib/aarch64-linux-gnu
          cp "$GL/ld-linux-aarch64.so.1" /tmp/rt/bin/
          cp "$GL/libc.so.6" "$GL/libm.so.6" "$GL/libpthread.so.0" "$GL/libdl.so.2" /tmp/rt/lib/
          (cd /tmp/rt && zip -qr "$GITHUB_WORKSPACE/android/app/src/main/assets/runtime-arm64.zip" .)
          unzip -l android/app/src/main/assets/runtime-arm64.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Copy Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r pwa/* android/app/src/main/assets/web/

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r server/requirements.txt pytest

      - name: Run bridge tests
        working-directory: server
        run: python -m pytest tests/ -v
