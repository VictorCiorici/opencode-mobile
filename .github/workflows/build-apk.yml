name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"
      - "daemon/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compile Native Static ARM64 Daemon
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cd daemon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../android/app/src/main/jniLibs/arm64-v8a/libdaemon.so .
          cd ..
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libdaemon.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Copy Assets
        run: |
          mkdir -p android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/server
          cp -r pwa/* android/app/src/main/assets/web/
          cp -r server/* android/app/src/main/assets/server/
          rm -rf android/app/src/main/assets/server/__pycache__

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk
