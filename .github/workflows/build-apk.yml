name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - "server/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 for packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Prepare Standalone AArch64 Runtime Bundle
        run: |
          mkdir -p staging/python
          mkdir -p staging/bin
          mkdir -p android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/server

          # 1. Download standalone relocatable AArch64 Python distribution
          PY_URL="https://github.com/astral-sh/python-build-standalone/releases/download/20240224/cpython-3.11.8+20240224-aarch64-unknown-linux-gnu-install_only.tar.gz"
          echo "Downloading standalone AArch64 Python distribution from $PY_URL..."
          curl -sL "$PY_URL" -o py_standalone.tar.gz
          tar -xzf py_standalone.tar.gz -C staging/

          # 2. Pre-install dependencies directly into the standalone Python site-packages
          TARGET_SP="staging/python/lib/python3.11/site-packages"
          mkdir -p "$TARGET_SP"
          pip install --target "$TARGET_SP" fastapi uvicorn httpx pydantic starlette anyio

          # 3. Create zip bundle for assets
          cd staging
          zip -r -9 ../android/app/src/main/assets/runtime-arm64.zip python/ bin/
          cd ..
          rm -rf staging py_standalone.tar.gz

          # 4. Copy Web and Server source assets
          cp -r pwa/* android/app/src/main/assets/web/
          cp -r server/* android/app/src/main/assets/server/
          rm -rf android/app/src/main/assets/server/__pycache__

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openforge-apk
          path: android/app/build/outputs/apk/debug/*.apk
