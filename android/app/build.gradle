plugins {
    id "com.android.application"
}

android {
    namespace "com.openforge"
    compileSdk 34
    defaultConfig {
        applicationId "com.openforge"
        minSdk 24
        // targetSdk 28 intentionally: newer targets make SELinux W^X forbid
        // exec'ing/dlopen'ing anything extracted into app storage, which the
        // bundled opencode engine + glibc runtime require. Sideload-only app.
        targetSdk 28
        versionCode 8
        versionName "0.5.3"
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildFeatures { viewBinding false }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.10.0"
}
